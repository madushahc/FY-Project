name: EduQuest CI/CD Pipeline - Netlify Automated Deployment

on:
  push:
    branches: [ dev, main, master ]
  pull_request:
    branches: [ dev, main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Full-Stack & Deploy to Netlify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend Dependencies & Build TypeScript
        run: |
          cd backend
          npm ci || npm install
          npm run build

      - name: Install Frontend Dependencies & Build Next.js
        run: |
          cd Frontend
          npm ci || npm install
          npm run build

      - name: Deploy Both Frontend & Serverless Backend to Netlify
        run: |
          npx netlify-cli deploy --prod --dir=Frontend/.next --functions=backend/dist/src
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
